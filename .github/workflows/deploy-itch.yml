name: Deploy Web to itch.io

on:
  push:
    branches: ["release/tojam2026"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup emsdk
        run: |
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk
          /tmp/emsdk/emsdk install 4.0.14
          /tmp/emsdk/emsdk activate 4.0.14

      - name: Ensure emsdk python path expected by build.zig
        run: |
          mkdir -p /tmp/emsdk/python/3.13.3_64bit/bin
          ln -sf "$(command -v python3)" /tmp/emsdk/python/3.13.3_64bit/bin/python3

      - name: Build web bundle
        run: |
          VERSION="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          zig build web -Demsdk=/tmp/emsdk -Doptimize=ReleaseFast -Dapp-mode=game -Dbuild-version="$VERSION"

      - name: Prepare itch output
        run: cp zig-out/web/tojam2026.html zig-out/web/index.html

      - name: Setup butler
        uses: remarkablegames/setup-butler@v3

      - name: Push to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          VERSION="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          butler push zig-out/web cbrnl/imperators-gambit:html5 --userversion "$VERSION"
