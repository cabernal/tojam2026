<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TOJam 2026 RTS Prototype</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111316;
      }

      body {
        color: #e8ecdf;
        font: 13px/1.4 ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #111316;
      }

      .loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(17, 19, 22, 0.88), rgba(17, 19, 22, 0.92)),
          repeating-linear-gradient(
            30deg,
            rgba(204, 177, 116, 0.08) 0,
            rgba(204, 177, 116, 0.08) 1px,
            transparent 1px,
            transparent 18px
          );
        transition:
          opacity 180ms ease,
          visibility 180ms ease;
      }

      .loading-overlay.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading-panel {
        width: min(520px, 100%);
      }

      .loading-title {
        margin-bottom: 10px;
        color: #f0d28a;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0;
      }

      .loading-stage {
        min-height: 20px;
        color: #f2f4e9;
      }

      .loading-detail {
        min-height: 20px;
        margin-top: 8px;
        color: #9ba596;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .loading-track {
        width: 100%;
        height: 14px;
        margin-top: 12px;
        border: 1px solid #394039;
        background: #080a09;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
      }

      .loading-bar {
        width: 8%;
        height: 100%;
        background: linear-gradient(90deg, #4ea2d7, #f0d26f);
        transition: width 160ms ease;
      }

      .loading-percent {
        margin-top: 6px;
        color: #c4cab9;
        text-align: right;
      }

      .loading-overlay.is-error .loading-title,
      .loading-overlay.is-error .loading-stage {
        color: #ff8a72;
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading-overlay" role="status" aria-live="polite">
      <div class="loading-panel">
        <div class="loading-title">TOJam 2026 RTS Prototype</div>
        <div id="loading-stage" class="loading-stage">Loading web runtime</div>
        <div class="loading-track" aria-hidden="true">
          <div id="loading-bar" class="loading-bar"></div>
        </div>
        <div id="loading-percent" class="loading-percent">8%</div>
        <div id="loading-detail" class="loading-detail">Fetching code and asset bundle</div>
      </div>
    </div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    <script>
      (() => {
        const overlay = document.getElementById("loading");
        const stage = document.getElementById("loading-stage");
        const detail = document.getElementById("loading-detail");
        const bar = document.getElementById("loading-bar");
        const percent = document.getElementById("loading-percent");
        const canvas = document.getElementById("canvas");
        let runDependencyTotal = 0;
        let lastPercent = 8;
        let handedOff = false;

        function handOffToGameLoader() {
          handedOff = true;
          overlay.hidden = true;
          overlay.classList.add("is-done");
        }

        function setProgress(nextPercent, nextStage, nextDetail) {
          if (handedOff) return;
          const clamped = Math.max(lastPercent, Math.min(100, Math.round(nextPercent)));
          lastPercent = clamped;
          bar.style.width = `${clamped}%`;
          percent.textContent = `${clamped}%`;
          if (nextStage) stage.textContent = nextStage;
          if (nextDetail) detail.textContent = nextDetail;
        }

        function setStatus(text) {
          if (!text) return;
          const match = text.match(/^(.*)\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)$/);
          if (match) {
            const loaded = Number(match[2]);
            const total = Math.max(Number(match[3]), 1);
            setProgress(18 + (loaded / total) * 52, match[1].trim() || "Downloading", text);
          } else {
            setProgress(lastPercent, text, "Preparing the game");
          }
        }

        window.Module = {
          canvas,
          preRun: [
            () => {
              handOffToGameLoader();
            }
          ],
          postRun: [handOffToGameLoader],
          setStatus,
          monitorRunDependencies(left) {
            runDependencyTotal = Math.max(runDependencyTotal, left);
            if (left > 0) {
              const done = runDependencyTotal > 0 ? (runDependencyTotal - left) / runDependencyTotal : 0;
              setProgress(70 + done * 20, "Mounting assets", `${left} loading task${left === 1 ? "" : "s"} remaining`);
            } else {
              setProgress(92, "Preparing renderer", "Starting game loop");
            }
          },
          printErr(text) {
            console.error(text);
          }
        };

        window.addEventListener("error", (event) => {
          handedOff = false;
          overlay.hidden = false;
          overlay.classList.add("is-error");
          setProgress(lastPercent, "Load failed", event.message || "Open the console for details");
        });

        setProgress(8, "Loading web runtime", "Fetching code and asset bundle");
      })();
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
